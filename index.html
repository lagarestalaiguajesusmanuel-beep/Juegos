<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sopa de Letras - Bases de Datos</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial;
}

/* FONDO CON TRANSICIÓN SUAVE */

body{
height:100vh;
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:white;
background:linear-gradient(45deg,#2563eb,#7c3aed,#db2777,#f59e0b,#22c55e);
background-size:600% 600%;
animation:fondo 18s ease infinite;

user-select:none;

}

@keyframes fondo{

0%{background-position:0% 50%}
25%{background-position:50% 100%}
50%{background-position:100% 50%}
75%{background-position:50% 0%}
100%{background-position:0% 50%}

}

/* BURBUJAS */

#bubbles{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* TITULO */

h1{
margin-bottom:5px;
}

#timer{
font-size:20px;
margin-bottom:10px;
}

/* CONTENEDOR */

.container{
display:flex;
gap:30px;
}

/* GRID */

#grid{
display:grid;
grid-template-columns:repeat(20,32px);
gap:3px;
background:rgba(0,0,0,0.25);
padding:10px;
border-radius:10px;
backdrop-filter:blur(6px);
}

.cell{
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,0.15);
border-radius:4px;
cursor:pointer;
font-weight:bold;
transition:0.15s;
}

.cell:hover{
background:rgba(255,255,255,0.35);
}

.selected{
background:#facc15;
color:black;
transform:scale(1.1);
}

.found{
color:white;
}

/* LISTA PALABRAS */

#words{
width:300px;
columns:2;
background:rgba(0,0,0,0.25);
padding:10px;
border-radius:10px;
}

.word{
margin:4px 0;
}

.foundWord{
text-decoration:line-through;
color:#22c55e;
font-weight:bold;
}

#resultado{
margin-top:10px;
font-size:22px;
font-weight:bold;
}



.victoria{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.4s;
}

.victoria.show{
opacity:1;
pointer-events:auto;
}

.victoriaCard{
background:white;
color:black;
padding:40px;
border-radius:15px;
text-align:center;
position:relative;
overflow:hidden;
animation:zoom 0.4s;
}

@keyframes zoom{
from{transform:scale(0.6)}
to{transform:scale(1)}
}

.victoriaCard h2{
margin-bottom:10px;
}

.victoriaCard button{
margin-top:15px;
padding:10px 25px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

.victoriaCard button:hover{
transform:scale(1.05);
}

/* FUEGOS */

.fire{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
pointer-events:none;
animation:boom 1.6s forwards;
}

@keyframes boom{

0%{
transform:translate(0,0) scale(1);
opacity:1;
}

100%{
transform:translate(var(--x),var(--y)) scale(0.2);
opacity:0;
}

}

</style>
</head>

<body>

<canvas id="bubbles"></canvas>

<h1>🔎 Sopa de Letras</h1>
<div id="timer">Tiempo: 0s</div>

<div class="container">

<div id="grid"></div>

<div id="words"></div>

</div>

<div id="resultado"></div>

<script>

/* ===== SONIDO CLICK ===== */

function playClick(){

const audioCtx=new (window.AudioContext||window.webkitAudioContext)()

const oscillator=audioCtx.createOscillator()
const gain=audioCtx.createGain()

oscillator.type="triangle"
oscillator.frequency.value=600

oscillator.connect(gain)
gain.connect(audioCtx.destination)

oscillator.start()

gain.gain.exponentialRampToValueAtTime(
0.00001,
audioCtx.currentTime+0.15
)

}

/* ===== BURBUJAS ===== */

const canvas=document.getElementById("bubbles")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

const colors=[
"#60a5fa","#34d399","#fbbf24",
"#f87171","#a78bfa","#22d3ee"
]

let bubbles=[]

for(let i=0;i<30;i++){

bubbles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:20+Math.random()*35,
dx:(Math.random()-0.5)*2,
dy:(Math.random()-0.5)*2,
color:colors[Math.floor(Math.random()*colors.length)]
})

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

bubbles.forEach(b=>{

b.x+=b.dx
b.y+=b.dy

if(b.x+b.r>canvas.width||b.x-b.r<0) b.dx*=-1
if(b.y+b.r>canvas.height||b.y-b.r<0) b.dy*=-1

ctx.beginPath()
ctx.arc(b.x,b.y,b.r,0,Math.PI*2)
ctx.fillStyle=b.color
ctx.globalAlpha=0.18
ctx.fill()

})

requestAnimationFrame(animate)

}

animate()

/* ===== SOPA DE LETRAS ===== */

function limpiar(t){
return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase()
}

const palabrasOriginales=[
"internet",
"direccionip",
"ipv4",
"ipv6",
"dominio",
"dns",
"url",
"http",
"https",
"tcp",
"udp",
"tcpip",
"router",
"modem",
"switch",
"wifi",
"ethernet",
"red",
"lan",
"wan",
"man",
"servidor",
"cliente",
"navegador",
"paginaweb",
"sitioweb",
"hosting",
"subdominio",
"puertodered",
"gateway",
"mascaradered",
"dhcp",
"firewall",
"vpn",
"proxy",
"correoelectronico",
"smtp",
"pop3",
"imap",
"paquetededatos",
"anchodabanda",
"latencia",
"ping",
"traceroute",
"dnssec",
"cookie",
"cache",
"streaming",
"cloudcomputing",
"ciberseguridad",
"phishing",
"malware",
"spam",
"ftp",
"sftp",
"ssh",
"ssl",
"tls",
"certificadodigital",
"nube",
"datacenter",
"api",
"cdn",
"intranet",
"extranet",
"packetloss",
"socket",
"websocket",
"html",
"javascript",
"internetdelascosas",
"iot",
"redesocial",
"buscador",
"servidorweb",
"proveedordeinternet",
"isp",
"conexion"
];

// MEZCLAR PALABRAS
function mezclar(array){
return array.sort(()=>Math.random()-0.5)
}

// TOMAR LA MITAD
const palabrasSeleccionadas = mezclar([...palabrasOriginales])
.slice(0, Math.floor(palabrasOriginales.length / 2))

// LIMPIAR PALABRAS
const palabras = palabrasSeleccionadas.map(p=>limpiar(p))

const size=20
const grid=[]
const gridElement=document.getElementById("grid")

let time=0
let timer=setInterval(()=>{
time++
document.getElementById("timer").innerText="Tiempo: "+formatearTiempo(time)
},1000)

/* GRID VACIO */

for(let r=0;r<size;r++){
grid[r]=[]
for(let c=0;c<size;c++) grid[r][c]=""
}

const dirs=[[0,1],[1,0],[1,1],[-1,1]]

function placeWord(word){

let attempts=0

while(attempts<200){

let dir=dirs[Math.floor(Math.random()*dirs.length)]
let row=Math.floor(Math.random()*size)
let col=Math.floor(Math.random()*size)

let fits=true

for(let i=0;i<word.length;i++){

let r=row+dir[0]*i
let c=col+dir[1]*i

if(r<0||c<0||r>=size||c>=size||grid[r][c]!=""){
fits=false
break
}

}

if(fits){

for(let i=0;i<word.length;i++){

let r=row+dir[0]*i
let c=col+dir[1]*i

grid[r][c]=word[i]

}

return true
}

attempts++

}

return false
}

/* 🔥 SOLO GUARDAR LAS QUE SI ENTRAN */
let palabrasColocadas = []

palabras.forEach(p=>{
if(placeWord(p)){
palabrasColocadas.push(p)
}
})

/* RELLENO */

const letras="ABCDEFGHIJKLMNÑOPQRSTUVWXYZ"

for(let r=0;r<size;r++){
for(let c=0;c<size;c++){

if(grid[r][c]==""){
grid[r][c]=letras[Math.floor(Math.random()*letras.length)]
}

}
}

/* CREAR GRID */

for(let r=0;r<size;r++){
for(let c=0;c<size;c++){

let cell=document.createElement("div")
cell.className="cell"
cell.innerText=grid[r][c]

gridElement.appendChild(cell)

}
}

/* 🔥 LISTA SOLO DE PALABRAS COLOCADAS */

const wordsDiv=document.getElementById("words")

palabrasColocadas.forEach(p=>{

let original = palabrasOriginales.find(w=>limpiar(w)===p)

let d=document.createElement("div")
d.className="word"
d.id="w_"+p
d.innerText=original

wordsDiv.appendChild(d)

})

</script>
<div id="victoria" class="victoria">

<div class="victoriaCard">

<h2>🎉 ¡Terminaste!</h2>

<p id="tiempoFinal"></p>

<button onclick="reiniciar()">Volver a intentar</button>

<div id="fireworks"></div>

</div>

</div>
</body>
</html>
