<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sopa de Letras - Bases de Datos</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial;
}

/* FONDO CON TRANSICIÓN SUAVE */

body{
height:100vh;
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:white;
background:linear-gradient(45deg,#2563eb,#7c3aed,#db2777,#f59e0b,#22c55e);
background-size:600% 600%;
animation:fondo 18s ease infinite;

user-select:none;

}

@keyframes fondo{

0%{background-position:0% 50%}
25%{background-position:50% 100%}
50%{background-position:100% 50%}
75%{background-position:50% 0%}
100%{background-position:0% 50%}

}

/* BURBUJAS */

#bubbles{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* TITULO */

h1{
margin-bottom:5px;
}

#timer{
font-size:20px;
margin-bottom:10px;
}

/* CONTENEDOR */

.container{
display:flex;
gap:30px;
}

/* GRID */

#grid{
display:grid;
grid-template-columns:repeat(20,32px);
gap:3px;
background:rgba(0,0,0,0.25);
padding:10px;
border-radius:10px;
backdrop-filter:blur(6px);
}

.cell{
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,0.15);
border-radius:4px;
cursor:pointer;
font-weight:bold;
transition:0.15s;
}

.cell:hover{
background:rgba(255,255,255,0.35);
}

.selected{
background:#facc15;
color:black;
transform:scale(1.1);
}

.found{
color:white;
}

/* LISTA PALABRAS */

#words{
width:300px;
columns:2;
background:rgba(0,0,0,0.25);
padding:10px;
border-radius:10px;
}

.word{
margin:4px 0;
}

.foundWord{
text-decoration:line-through;
color:#22c55e;
font-weight:bold;
}

#resultado{
margin-top:10px;
font-size:22px;
font-weight:bold;
}



.victoria{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.4s;
}

.victoria.show{
opacity:1;
pointer-events:auto;
}

.victoriaCard{
background:white;
color:black;
padding:40px;
border-radius:15px;
text-align:center;
position:relative;
overflow:hidden;
animation:zoom 0.4s;
}

@keyframes zoom{
from{transform:scale(0.6)}
to{transform:scale(1)}
}

.victoriaCard h2{
margin-bottom:10px;
}

.victoriaCard button{
margin-top:15px;
padding:10px 25px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

.victoriaCard button:hover{
transform:scale(1.05);
}

/* FUEGOS */

.fire{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
pointer-events:none;
animation:boom 1.6s forwards;
}

@keyframes boom{

0%{
transform:translate(0,0) scale(1);
opacity:1;
}

100%{
transform:translate(var(--x),var(--y)) scale(0.2);
opacity:0;
}

}

</style>
</head>

<body>

<canvas id="bubbles"></canvas>

<h1>🔎 Sopa de Letras</h1>
<div id="timer">Tiempo: 0s</div>

<div class="container">

<div id="grid"></div>

<div id="words"></div>

</div>

<div id="resultado"></div>

<script>

/* ===== SONIDO CLICK ===== */

function playClick(){

const audioCtx=new (window.AudioContext||window.webkitAudioContext)()

const oscillator=audioCtx.createOscillator()
const gain=audioCtx.createGain()

oscillator.type="triangle"
oscillator.frequency.value=600

oscillator.connect(gain)
gain.connect(audioCtx.destination)

oscillator.start()

gain.gain.exponentialRampToValueAtTime(
0.00001,
audioCtx.currentTime+0.15
)

}

/* ===== BURBUJAS ===== */

const canvas=document.getElementById("bubbles")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

const colors=[
"#60a5fa","#34d399","#fbbf24",
"#f87171","#a78bfa","#22d3ee"
]

let bubbles=[]

for(let i=0;i<30;i++){

bubbles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:20+Math.random()*35,
dx:(Math.random()-0.5)*2,
dy:(Math.random()-0.5)*2,
color:colors[Math.floor(Math.random()*colors.length)]
})

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

bubbles.forEach(b=>{

b.x+=b.dx
b.y+=b.dy

if(b.x+b.r>canvas.width||b.x-b.r<0) b.dx*=-1
if(b.y+b.r>canvas.height||b.y-b.r<0) b.dy*=-1

ctx.beginPath()
ctx.arc(b.x,b.y,b.r,0,Math.PI*2)
ctx.fillStyle=b.color
ctx.globalAlpha=0.18
ctx.fill()

})

requestAnimationFrame(animate)

}

animate()

/* ===== SOPA DE LETRAS ===== */

function limpiar(t){
return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase()
}

const palabrasOriginales=[
"base","datos","tabla","campo","registro","fila","columna","consulta","sql","oracle","servidor","cliente","información","gestor","motor","índice","clave","llave","primaria","foránea","relación","entidad","atributo","modelo","diagrama","estructura","dominio","dato","texto","número","fecha","booleano","búsqueda","insertar","eliminar","actualizar","seleccionar","usuario","permisos","seguridad","acceso","conexión","servidor","cliente","backup","restaurar","restricción","normalización","primeraforma","segundaforma","terceraforma","cardinalidad","dependencia","relacional","documento","Colección","Nodo","Distribuido","Replicación","escalabilidad","bigdata","almacenamiento","estructurado","noestructurado","metadato","archivo","carpeta","plataforma","aplicación","tecnología"
]

const palabras=palabrasOriginales.map(p=>limpiar(p))

const size=20
const grid=[]
const gridElement=document.getElementById("grid")

let time=0
let timer=setInterval(()=>{
time++
document.getElementById("timer").innerText="Tiempo: "+formatearTiempo(time)
},1000)

/* GRID VACIO */

for(let r=0;r<size;r++){
grid[r]=[]
for(let c=0;c<size;c++) grid[r][c]=""
}

const dirs=[[0,1],[1,0],[1,1],[-1,1]]

function placeWord(word){

let attempts=0

while(attempts<200){

let dir=dirs[Math.floor(Math.random()*dirs.length)]
let row=Math.floor(Math.random()*size)
let col=Math.floor(Math.random()*size)

let fits=true

for(let i=0;i<word.length;i++){

let r=row+dir[0]*i
let c=col+dir[1]*i

if(r<0||c<0||r>=size||c>=size||grid[r][c]!=""){
fits=false
break
}

}

if(fits){

for(let i=0;i<word.length;i++){

let r=row+dir[0]*i
let c=col+dir[1]*i

grid[r][c]=word[i]

}

return
}

attempts++

}

}

palabras.forEach(placeWord)

/* RELLENO */

const letras="ABCDEFGHIJKLMNÑOPQRSTUVWXYZ"

for(let r=0;r<size;r++){
for(let c=0;c<size;c++){

if(grid[r][c]==""){
grid[r][c]=letras[Math.floor(Math.random()*letras.length)]
}

}
}

/* CREAR GRID */

for(let r=0;r<size;r++){
for(let c=0;c<size;c++){

let cell=document.createElement("div")
cell.className="cell"
cell.innerText=grid[r][c]

gridElement.appendChild(cell)

}
}

/* LISTA PALABRAS */

const wordsDiv=document.getElementById("words")

palabrasOriginales.forEach((w,i)=>{

let d=document.createElement("div")
d.className="word"
d.id="w_"+palabras[i]
d.innerText=w

wordsDiv.appendChild(d)

})

/* SELECCION */

let selecting=false
let selected=[]
let direction=null

gridElement.addEventListener("mousedown",e=>{
if(e.target.classList.contains("cell")){

selecting=true
selected=[e.target]
direction=null

e.target.classList.add("selected")

}
})

gridElement.addEventListener("mouseover",e=>{

if(!selecting) return
if(!e.target.classList.contains("cell")) return

const cells=[...document.querySelectorAll(".cell")]

const getPos=(cell)=>{
const index=cells.indexOf(cell)
return {
row:Math.floor(index/size),
col:index%size
}
}

const first=getPos(selected[0])
const current=getPos(e.target)

let dr=current.row-first.row
let dc=current.col-first.col

if(selected.length===1){

if(dr!==0) dr=dr/Math.abs(dr)
if(dc!==0) dc=dc/Math.abs(dc)

direction=[dr,dc]

}else{

const prev=getPos(selected[selected.length-1])

if(
current.row-prev.row!==direction[0] ||
current.col-prev.col!==direction[1]
){
return
}

}

if(!selected.includes(e.target)){

selected.push(e.target)
e.target.classList.add("selected")

}

})

document.addEventListener("mouseup",()=>{
selecting=false
direction=null
checkWord()
})

const colorsWord=[
"#ef4444","#3b82f6","#22c55e",
"#eab308","#a855f7","#06b6d4","#f97316"
]

let found=[]

function checkWord(){

let word=selected.map(c=>c.innerText).join("")
let reverse=word.split("").reverse().join("")

palabras.forEach(p=>{

if((word==p||reverse==p)&&!found.includes(p)){

found.push(p)

let color=colorsWord[Math.floor(Math.random()*colorsWord.length)]

selected.forEach(c=>{
c.style.background=color
c.classList.remove("selected")
c.classList.add("found")
})

document.getElementById("w_"+p).classList.add("foundWord")

playClick()

if(found.length==palabras.length){

clearInterval(timer)

mostrarVictoria()

}

selected=[]

}

})

selected.forEach(c=>{
if(!c.classList.contains("found")){
c.classList.remove("selected")
}
})

selected=[]





}


function mostrarVictoria(){

document.getElementById("tiempoFinal").innerText=
"Tiempo total: "+formatearTiempo(time)

const modal=document.getElementById("victoria")

modal.classList.add("show")

fuegos()

}

/* FUEGOS ARTIFICIALES */

function fuegos(){

const contenedor=document.getElementById("fireworks")

const colores=[
"#ff3838","#ffd32a","#18dcff",
"#7d5fff","#2ed573","#ff9f1a"
]

for(let i=0;i<150;i++){

let f=document.createElement("div")

f.className="fire"

f.style.background=
colores[Math.floor(Math.random()*colores.length)]

f.style.left="50%"
f.style.top="50%"

f.style.setProperty("--x",(Math.random()*600-300)+"px")
f.style.setProperty("--y",(Math.random()*600-300)+"px")

contenedor.appendChild(f)

setTimeout(()=>f.remove(),1600)

}

}

/* REINICIAR */

function reiniciar(){

location.reload()

}

function formatearTiempo(seg){

let horas=Math.floor(seg/3600)
let minutos=Math.floor((seg%3600)/60)
let segundos=seg%60

return (
String(horas).padStart(2,"0")+":"+
String(minutos).padStart(2,"0")+":"+
String(segundos).padStart(2,"0")
)

}


</script>
<div id="victoria" class="victoria">

<div class="victoriaCard">

<h2>🎉 ¡Terminaste!</h2>

<p id="tiempoFinal"></p>

<button onclick="reiniciar()">Volver a intentar</button>

<div id="fireworks"></div>

</div>

</div>
</body>
</html>
